# Declarative Automation Bundle (formerly "Databricks Asset Bundles") for course 2's enterprise track.
#
# UNTESTED TEMPLATE. It declares the same job that 04_job_and_alerts creates with the SDK, as a file you can review,
# version and deploy. It has not been deployed to the agency workspace yet: validate it there before relying on it.
#
# The job refreshes course 1's pipeline (course 1's own bundle or notebook 02 creates it) and then runs course 2's
# quality task. Course 2 doesn't define or change that pipeline: it looks up its ID by name.
#
# How to deploy without a command line: open this file in the workspace (course 2's Git folder,
# enterprise/databricks.yml), click the Deployments icon in the left pane, choose the "dev" target, and click Deploy.
# Workspace deployments are source-linked: they run the files in your Git folder.
#
# Before you deploy:
#   1. Finish course 1's track through 02_pipeline, and run 00_preflight here.
#   2. Check that "pipeline_id" below looks up the pipeline course 1 created (00_preflight prints its name). If
#      course 1's pipeline was deployed from its bundle in development mode, its name has a "[dev you]" prefix:
#      type that name in.
#   3. Use 04_job_and_alerts OR this bundle, not both: they would make two jobs refreshing one pipeline.

bundle:
  name: lnl_enterprise_course2

variables:
  pipeline_id:
    description: Course 1's pipeline, found by its name (the ID changes if it's recreated).
    lookup:
      pipeline: lnl_hero_offenders_${workspace.current_user.short_name}
  track_root:
    description: Course 2's enterprise/ folder, so the quality task finds its helpers and settings.
  alert_destination_id:
    description: ID of a notification destination for PagerDuty or a ServiceNow webhook (an admin creates it).
    default: ""

targets:
  dev:
    mode: development          # prefixes names with [dev you] and keeps schedules paused
    default: true
    variables:
      track_root: /Workspace/Users/${workspace.current_user.userName}/lakehouse/enterprise

resources:
  jobs:
    lnl_hero_offenders_daily:
      name: lnl_hero_offenders_daily_${workspace.current_user.short_name}
      description: "Homelake course 2: refresh course 1's mock-data pipeline, then check data quality."
      max_concurrent_runs: 1
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${var.pipeline_id}
        - task_key: validate_quality
          depends_on:
            - task_key: refresh_pipeline
          notebook_task:
            notebook_path: ./tasks/validate_quality.ipynb
            base_parameters:
              run_id: "{{job.run_id}}"
              track_root: ${var.track_root}
      schedule:
        quartz_cron_expression: "0 50 5 * * ?"     # 5:50 AM Central, before the workday
        timezone_id: America/Chicago
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
        no_alert_for_skipped_runs: true
      # Uncomment once an admin has created the PagerDuty or ServiceNow destination and you've set
      # alert_destination_id (Settings -> Notifications shows the ID):
      # webhook_notifications:
      #   on_failure:
      #     - id: ${var.alert_destination_id}
      tags:
        project: homelake
        data: mock

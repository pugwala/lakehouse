# Lakehouse checks: everything that needs no secrets and no running stack (lakehouse/ci/checks.sh), on every push
# and pull request, or by hand: gh workflow run lakehouse-ci.yml --ref main (or the Actions tab). Course 1 is the
# submodule course1/, checked out at its pin, since the handoff check runs its code.
name: lakehouse-ci

on:
  push:
  pull_request:
  workflow_dispatch:   # also runnable by hand from the Actions tab

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true   # course 1, pinned at its tag (course1/)
      - name: Is there a lakehouse on this branch?
        id: here
        run: |
          if [ -f lakehouse/ci/checks.sh ]; then echo "lakehouse=yes" >> "$GITHUB_OUTPUT"
          else echo "lakehouse=no" >> "$GITHUB_OUTPUT"; echo "No lakehouse/ on this branch: nothing to check."; fi
      - uses: actions/setup-python@v7.0.0
        if: steps.here.outputs.lakehouse == 'yes'
        with:
          python-version: "3.13"
      - name: Install bats and acl
        if: steps.here.outputs.lakehouse == 'yes'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats acl
      - name: Run the lakehouse checks
        if: steps.here.outputs.lakehouse == 'yes'
        run: bash lakehouse/ci/checks.sh
